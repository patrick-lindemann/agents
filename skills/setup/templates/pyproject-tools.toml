# Tool settings for pyproject.toml. Merge into the project's file; keep its own values
# where they are stricter. The rules in ~/agents/rules/ rely on these settings and do not
# repeat what they enforce:
#   ruff A: no shadowed builtins as names or modules; UP: modern annotation syntax for
#   target-version; B905: zip(strict=); B904: raise ... from; PLC0415: top-level imports;
#   T20: no print; G: no f-strings in logging; RUF005: unpacking over concatenation;
#   RUF100: no unused noqa; PGH003, PGH004: suppressions name their rule; UP035, UP043:
#   collections.abc and default type arguments; TID251: no TYPE_CHECKING, except a cycle;
#   ty missing-override-decorator: @override; unused-ignore-comment,
#   unused-type-ignore-comment: no stale ignores; blanket-ignore-comment: ignores name
#   their rule. ty also rejects TypedDict defaults and methods, and writing a ClassVar
#   through an instance.

[project]
requires-python = ">=3.12"  # the lowest supported version; an application may pin one minor: ">=3.13,<3.14"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py312"  # the lowest supported Python

[tool.ruff.lint]
# A library adds "PT", "RUF", "SIM" and "W".
select = ["A", "B", "D", "E", "F", "G", "I", "PGH", "PLC0415", "RUF005", "RUF100", "T20", "TID", "UP"]
# A library ignores only D100, D104 and D105; an application may also ignore D101-D107.
# A project with jaxtyping adds "F722".
ignore = ["D100", "D104", "D105"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["<package>"]
section-order = ["future", "standard-library", "third-party", "first-party", "tests", "local-folder"]

[tool.ruff.lint.isort.sections]
tests = ["tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Restructure the import; for a real cycle add `# noqa: TID251`."

# Type checker: ty, run as `uv run ty check`. Check src and tests. ty reads the Python
# version from requires-python. A dependency without type information goes into
# allowed-unresolved-imports by module ("<module>.**"), never globally.
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = []

[tool.ty.rules]
missing-override-decorator = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
blanket-ignore-comment = "error"

[tool.pytest.ini_options]
# A project with jaxtyping appends "--jaxtyping-packages=<package>,beartype.beartype".
addopts = "--import-mode=importlib --strict-markers"
markers = ["slow: long end-to-end test; skip with -m 'not slow'"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
